<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Lowongan - Telkom Career Hub</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="shell">
    <div id="sidebar-placeholder"></div>
    <div class="main">
      <div id="topbar-placeholder"></div>
      
      <div class="content">
        <div class="action-row" style="margin-bottom: 20px;">
          <a href="lowongan.html" class="btn">&larr; Kembali ke Daftar</a>
          <h2 class="topbar-title">Tambah Lowongan Baru</h2>
        </div>

        <div class="card">
          <div class="grid-2">
            <div class="form-row">
              <label class="form-label">Judul Lowongan</label>
              <input type="text" class="form-input" placeholder="Contoh: Senior Frontend Developer">
            </div>
            <div class="form-row">
              <label class="form-label">Nama Perusahaan / Mitra</label>
              <input type="text" class="form-input" placeholder="Pilih atau ketik nama mitra">
            </div>
          </div>

          <div class="grid-3">
            <div class="form-row">
              <label class="form-label">Kategori / Jurusan</label>
              <select class="form-select">
                <option>PPLG</option>
                <option>TJKT</option>
                <option>DKV</option>
                <option>Animasi</option>
                <option>Broadcasting</option>
              </select>
            </div>
            <div class="form-row">
              <label class="form-label">Lokasi</label>
              <input type="text" class="form-input" placeholder="Contoh: Bandung, Remote">
            </div>
            <div class="form-row">
              <label class="form-label">Deadline Pendaftaran</label>
              <input type="date" class="form-input">
            </div>
          </div>

          <div class="grid-3">
            <div class="form-row">
              <label class="form-label">Tipe Pekerjaan</label>
              <select class="form-select">
                <option>Full-time</option>
                <option>Part-time</option>
                <option>Internship</option>
                <option>Contract</option>
              </select>
            </div>
            <div class="form-row">
              <label class="form-label">Gaji (Opsional)</label>
              <input type="text" class="form-input" placeholder="Contoh: 5jt - 7jt">
            </div>
            <div class="form-row">
              <label class="form-label">Status Lowongan</label>
              <select class="form-select">
                <option>Aktif</option>
                <option>Draft</option>
                <option>Tutup</option>
              </select>
            </div>
          </div>

          <div class="form-row" style="margin-top: 10px;">
            <label class="form-label">Deskripsi Pekerjaan & Kualifikasi</label>
            <textarea class="form-input" style="height: 400px; resize: vertical; padding: 12px; line-height: 1.6;" placeholder="Tuliskan detail pekerjaan, kualifikasi, tanggung jawab, dan cara melamar di sini..."></textarea>
          </div>

          <div class="form-section" style="display:flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
             <a href="lowongan.html" class="btn">Batal</a>
             <button class="btn btn-primary" style="background: var(--text); color: #fff;" onclick="alert('Lowongan berhasil disimpan!')">Simpan Lowongan</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    renderAdminSidebar('lowongan');
    renderAdminTopbar('Tambah Lowongan');
  </script>
</body>
</html>
