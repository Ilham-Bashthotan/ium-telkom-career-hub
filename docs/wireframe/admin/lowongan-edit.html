<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Lowongan - Telkom Career Hub</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="shell">
    <div id="sidebar-placeholder"></div>
    <div class="main">
      <div id="topbar-placeholder"></div>
      
      <div class="content">
        <div class="action-row" style="margin-bottom:20px;align-items:center;gap:12px;flex-wrap:wrap">
          <a href="lowongan-detail.html" class="btn">&larr; Kembali ke Detail</a>
          <h2 class="topbar-title">Edit Lowongan</h2>
        </div>

        <div class="card">
          <div class="grid-2">
            <div class="form-row">
              <label class="form-label" for="field-title">Judul Lowongan</label>
              <input id="field-title" type="text" class="form-input" value="Frontend Developer">
            </div>
            <div class="form-row">
              <label class="form-label" for="field-company">Nama Perusahaan / Mitra</label>
              <input id="field-company" type="text" class="form-input" value="PT Telkom Indonesia">
            </div>
          </div>

          <div class="grid-3">
            <div class="form-row">
              <label class="form-label" for="field-major">Kategori / Jurusan</label>
              <select id="field-major" class="form-select">
                <option selected>PPLG</option>
                <option>TJKT</option>
                <option>DKV</option>
                <option>Animasi</option>
                <option>Broadcasting</option>
              </select>
            </div>
            <div class="form-row">
              <label class="form-label" for="field-location">Lokasi</label>
              <input id="field-location" type="text" class="form-input" value="Bandung, Jawa Barat">
            </div>
            <div class="form-row">
              <label class="form-label" for="field-deadline">Deadline Pendaftaran</label>
              <input id="field-deadline" type="date" class="form-input" value="2026-05-30">
            </div>
          </div>

          <div class="grid-3">
            <div class="form-row">
              <label class="form-label" for="field-type">Tipe Pekerjaan</label>
              <select id="field-type" class="form-select">
                <option selected>Full-time</option>
                <option>Part-time</option>
                <option>Internship</option>
                <option>Contract</option>
              </select>
            </div>
            <div class="form-row">
              <label class="form-label" for="field-salary">Gaji (Opsional)</label>
              <input id="field-salary" type="text" class="form-input" value="Negotiable">
            </div>
            <div class="form-row">
              <label class="form-label" for="field-status">Status Lowongan</label>
              <select id="field-status" class="form-select">
                <option selected>Aktif</option>
                <option>Draft</option>
                <option>Tutup</option>
              </select>
            </div>
          </div>

          <div class="form-row" style="margin-top: 10px;">
            <label class="form-label" for="field-description">Deskripsi Pekerjaan & Kualifikasi</label>
            <textarea id="field-description" class="form-input" style="height: 400px; resize: vertical; padding: 12px; line-height: 1.6;">PT Telkom Indonesia membuka kesempatan bagi talenta terbaik untuk bergabung sebagai Frontend Developer.

Tanggung Jawab:
- Mengembangkan antarmuka pengguna yang responsif.
- Berkolaborasi dengan tim backend untuk integrasi API.
- Memastikan performa aplikasi web yang optimal.

Kualifikasi:
- Menguasai HTML, CSS, dan JavaScript.
- Memahami framework React atau Vue adalah nilai tambah.
- Lulusan PPLG SMK Telkom.
- Memiliki portfolio yang relevan.</textarea>
          </div>

          <div class="form-section" style="display:flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
             <a href="lowongan-detail.html" class="btn">Batal</a>
             <button class="btn btn-primary" style="background: var(--text); color: #fff;" onclick="saveLowongan()">Simpan Perubahan</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    renderAdminSidebar('lowongan');
    renderAdminTopbar('Edit Lowongan');

    function saveLowongan() {
      alert('Perubahan berhasil disimpan!');
      window.location.href = 'lowongan-detail.html';
    }
  </script>
</body>
</html>
