<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Telkom Career Hub</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at top right, var(--primary-light), transparent), var(--bg);
    }
    .login-card {
        max-width: 440px;
        width: 100%;
        padding: 3rem;
        box-shadow: var(--shadow-lg);
    }
    .form-label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 0.5rem;
        display: block;
    }
    .form-input {
        width: 100%;
        padding: 0.875rem 1rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--bg);
        transition: all 0.2s ease;
        font-size: 1rem;
    }
    .form-input:focus {
        outline: none;
        border-color: var(--primary);
        background: white;
        box-shadow: 0 0 0 4px var(--primary-light);
    }
  </style>
</head>
<body>
  
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <div style="background: var(--primary); color: white; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; margin: 0 auto 1.5rem;">T</div>
      <h1 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.025em;">Selamat Datang</h1>
      <p style="color: var(--muted); font-size: 0.875rem; margin-top: 0.5rem;">Masuk untuk mengelola karir Anda</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div style="margin-bottom: 1.5rem;">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="name@example.com" required>
      </div>
      <div style="margin-bottom: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <label class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="#" style="font-size: 0.75rem; color: var(--primary); font-weight: 600;">Lupa Password?</a>
        </div>
        <input type="password" class="form-input" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="btn btn-primary btn-block" style="padding: 0.875rem;">Masuk Sekarang</button>
    </form>

    <div style="text-align: center; margin-top: 2rem; font-size: 0.875rem; color: var(--muted);">
      Belum punya akun? <a href="register.html" style="color: var(--primary); font-weight: 700;">Daftar Akun Baru</a>
    </div>
    
    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line);">
      <a href="index.html" style="font-size: 0.875rem; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 0.5rem;"><i data-lucide="arrow-left" style="width: 16px; height: 16px"></i> Kembali ke Beranda</a>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
    function handleLogin(e) {
      e.preventDefault();
      sessionStorage.setItem('userLoggedIn', '1');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
